<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ecology Survival Game</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>Ecology Survival Game - Jonathan & Tyler</h1>
    <p>Choose an organism and experience life in the ecosystem.</p>
  </header>

  <main class="container">

    <section class="filters">
      <div class="filter-group">
        <label for="roleFilter"><strong>Role:</strong></label>
        <select id="roleFilter">
          <option value="all">All</option>
          <option value="Producer">Producer 🌱</option>
          <option value="Consumer">Consumer 🍖</option>
          <option value="Decomposer">Decomposer 🍄</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="searchInput"><strong>Search:</strong></label>
        <input id="searchInput" type="text" placeholder="Type to filter by name..." />
      </div>
    </section>

    <section id="cardGrid" class="card-grid" aria-live="polite">
      <!-- Cards injected by script.js -->
    </section>

    <section id="detailPanel" class="detail-panel hidden">
      <div id="detailContent"><!-- Filled dynamically --></div>
    </section>
  </main>

  <footer class="site-footer">
    <small>© Ecology Survival Game<br>Jonathan & Tyler</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
