<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ecology Survival Game - Play</title>
  <link rel="stylesheet" href="game-styles.css" />
</head>
<body>
  <!-- Animated Background -->
  <div id="background"></div>

  <!-- Game UI -->
  <div id="gameUI">
    <!-- Top Bar -->
    <div class="top-bar">
      <!-- Organism Info -->
      <div class="info-card organism-info">
        <h3>Playing as: <span id="organismName">Loading...</span></h3>
        <div class="role-badge-container">
          <div class="role-color" id="roleColor"></div>
          <span id="roleLabel">PRODUCER</span>
        </div>
      </div>

      <!-- Stats Panel -->
      <div class="info-card stats-panel">
        <div class="stat-item">
          <div class="stat-header">
            <span class="stat-label">Energy</span>
            <span class="stat-value" id="energyValue">100%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="energyBar" style="width: 100%"></div>
          </div>
        </div>
        <div class="stat-item">
          <div class="stat-header">
            <span class="stat-label">Score</span>
            <span class="stat-value score" id="scoreValue">0</span>
          </div>
        </div>
        <div class="stat-item">
          <div class="stat-header">
            <span class="stat-label">Survival Time</span>
            <span class="stat-value time" id="timeValue">0:00</span>
          </div>
        </div>
      </div>

      <!-- Quit Button -->
      <div>
        <button class="btn btn-quit" id="quitBtn">Quit Game</button>
      </div>
    </div>

    <!-- Gameplay Area -->
    <div class="gameplay-area">
      <div class="game-title">
        <div class="organism-image-container">
          <img id="organismImage" src="" alt="Organism" class="organism-image" />
        </div>
        <h2 id="gameTitle">🌱 Plant Life Cycle</h2>
        <div class="resource-bars">
          <div class="resource-card">
            <p class="resource-label">Sun Energy</p>
            <div class="resource-progress">
              <div class="resource-fill sun" id="sunBar" style="width: 0%"></div>
            </div>
          </div>
          <div class="resource-card">
            <p class="resource-label">Water Energy</p>
            <div class="resource-progress">
              <div class="resource-fill water" id="waterBar" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Rhythm Game Area -->
      <div class="rhythm-container">
        <div class="rhythm-instruction" id="instruction">Press SPACE when the bar is in the green zone!</div>
        <div class="rhythm-track">
          <div class="hit-zone" id="hitZone"></div>
          <div class="rhythm-slider" id="slider"></div>
          <div class="track-label">
            <span id="currentAction">☀️ Collect Sunlight!</span>
          </div>
        </div>
        <div class="difficulty-label">
          Difficulty: <span id="difficultyLabel">MEDIUM</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen" class="game-over hidden">
    <div class="game-over-panel">
      <h1>Game Over!</h1>
      <div class="final-stats">
        <p>Final Score: <strong id="finalScore">0</strong></p>
        <p>Survival Time: <strong id="finalTime">0:00</strong></p>
        <p id="finalMessage">You tried your best!</p>
      </div>
      <div class="game-over-actions">
        <button class="btn btn-primary" id="restartBtn">Play Again</button>
        <button class="btn" id="backToMenuBtn">Back to Menu</button>
      </div>
    </div>
  </div>

  <script src="game-script.js"></script>
</body>
</html>
